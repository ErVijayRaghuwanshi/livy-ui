services:

  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile.spark
    container_name: spark-master
    hostname: spark-master
    user: "root"
    ports:
      - '7077:7077'
      - '8080:8080'      # Spark Master UI
      - '18080:18080'    # Spark History Server UI
      - '15002:15002'    # Spark Connect Server port
      - '8998:8998'      # livy-next REST API (with built-in CORS)
    volumes:
      - ./spark/data:/tmp/data
      - ./spark/work-dir:/opt/spark/work-dir
      - spark_event_logs:/opt/spark/event_logs
      - spark_ivy_cache:/tmp/.ivy
      - spark_warehouse:/opt/spark/warehouse
      - spark_metastore:/opt/spark/metastore
    networks:
      - data-platform

  livy-ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_REPO: https://github.com/ErVijayRaghuwanshi/livy-ui.git
        GIT_BRANCH: feature/v1.5.0
    container_name: livy-ui
    ports:
      - '4173:4173'
    depends_on:
      - spark
    networks:
      - data-platform


# ==============================================================================
# Network & Volume Bindings
# ==============================================================================
networks:
  data-platform:
    driver: bridge
    name: data-platform

volumes:
  spark_event_logs:
  spark_ivy_cache:
  spark_warehouse:
  spark_metastore: